# Linux / UQ Bunya eval config.
#
# Model and detector settings match the verified local Windows setup
# (infer_config.windows.yaml): same experts, thresholds, batch sizes, LLaVA
# paths, and generation settings. Linux uses fork-based DataLoader workers, so
# num_workers matches the upstream Linux defaults rather than the Windows
# spawn workaround.
#
# Weight paths are repo-relative by default (weights/...). On Bunya, stage
# weights under the clone or symlink them into place — see docs/BUNYA_SETUP.md.
#
# Optional overrides (expanded by the runner via os.path.expandvars):
#   export X2DFD_WEIGHTS=/scratch/$USER/x2dfd/weights
# then replace each weights/... entry below with ${X2DFD_WEIGHTS}/...

paths:
  results_dir: "eval/outputs"

weak_supplies:
  - provider: blending
    alias: Blending
    model_name: swinv2_base_window16_256
    weights_path: weights/blending_models/best_gf.pth
    img_size: 256
    num_class: 2
    batch_size: 128
    num_workers: 8
    pin_memory: true
    thresholds: { lo: 0.30, hi: 0.70 }

  - provider: diffusion_detector
    alias: Diffusion
    weights_dir: weights/
    model: ours-sync
    batch_size: 32
    num_workers: 8
    pin_memory: true
    thresholds: { lo: 0.30, hi: 0.70 }

model:
  base: weights/base/llava-v1.5-7b
  adapter: weights/checkpoints/ckpt/llava-v1.5-7b-lora-[ble-diff]

infer:
  inputs:
    - "datasets/raw/data/test/Tiny_Test/DFDCP_real.json"
    - "datasets/raw/data/test/Tiny_Test/DFDCP_fake.json"
    - "datasets/raw/data/test/Tiny_Test/DFDC_real.json"
    - "datasets/raw/data/test/Tiny_Test/DFDC_fake.json"
  question_template: "<image>\nIs this image real or fake? And the {alias} score is {score}."
  temperature: 0.0
  top_p: 1.0
  num_beams: 1
  max_new_tokens: 4
